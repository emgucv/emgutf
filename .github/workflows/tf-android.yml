name: Ubuntu TF Android Builder

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest
    # GitHub-hosted runners stop jobs after 6 hours
    timeout-minutes: 360

    steps:
    - uses: actions/checkout@v4
    - name: Check out submodules
      run: git submodule update --init --recursive
    - name: Install bazelisk
      run: |
        sudo curl -fsSL -o /usr/local/bin/bazel https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
        sudo chmod +x /usr/local/bin/bazel
    - name: Set up Android SDK and NDK
      # build_tf_android expects the SDK at /usr/lib/android-sdk
      run: |
        yes | sudo env "JAVA_HOME=$JAVA_HOME" "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
        sudo env "JAVA_HOME=$JAVA_HOME" "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "platforms;android-36" "build-tools;36.0.0"
        sudo ln -sfn "$ANDROID_HOME" /usr/lib/android-sdk
    - name: Build Emgu TF Android native binary
      run: ./build_tf_android arm64 arm64-v8a
      working-directory: ${{ github.workspace }}/platforms/android
